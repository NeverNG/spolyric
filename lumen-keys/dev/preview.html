<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>Lumen Keys preview</title>
<style>
    html, body { margin: 0; width: 100%; height: 100%; background: #202740; overflow: hidden; }
    #stage { position: fixed; inset: 0; }
    #hud {
        position: fixed; left: 20px; bottom: 18px; z-index: 10;
        font: 12px/1.6 ui-sans-serif, system-ui, sans-serif; color: rgba(255,255,255,0.55);
        letter-spacing: 0.08em; pointer-events: none;
    }
    #error {
        position: fixed; inset: 0; z-index: 20; display: none;
        padding: 32px; background: #1a1f33; color: #ffd9d9;
        font: 13px/1.6 ui-monospace, monospace; white-space: pre-wrap; overflow: auto;
    }
</style>
</head>
<body>
<div id="stage"></div>
<pre id="error"></pre>
<script type="module" src="./preview.mjs"></script>
</body>
</html>
